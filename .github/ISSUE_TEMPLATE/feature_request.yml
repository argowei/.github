name: Feature request
description: Suggest a focused improvement
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What is difficult today, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the outcome you want. Include any relevant network or deployment assumptions.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or other approaches.
